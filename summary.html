<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สรุปล่าสุดตารางวันหยุด</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;margin:0;color:#111827}
    .container{max-width:1200px;margin:0 auto;padding:24px}
    h1{margin:0 0 8px}.subtitle{color:#6b7280;margin-top:0}
    .card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06);margin-bottom:16px}
    .status{background:#ecfdf5;border-left:5px solid #10b981;padding:12px;border-radius:10px;color:#065f46}
    .warn{background:#fff7ed;border-left:5px solid #f97316;padding:12px;border-radius:10px;color:#7c2d12}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
    button,a.btn{background:#2563eb;color:white;border:none;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
    a.btn.gray,button.gray{background:#4b5563}
    .person-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
    .person-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#fbfdff}
    .person-name{font-weight:950;font-size:17px;margin-bottom:8px}
    .date-pill{display:inline-block;background:#eef2ff;color:#3730a3;padding:5px 8px;border-radius:999px;margin:3px;font-size:13px;font-weight:800}
    table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
    th,td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left;vertical-align:top}
    th{background:#f9fafb}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:white}
    .dow{background:#111827;color:white;text-align:center;font-weight:900;padding:10px 4px;font-size:13px}
    .day{min-height:145px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:8px;box-sizing:border-box;background:white}
    .day:nth-child(7n){border-right:none}.empty{background:#f3f4f6}.busy-day{background:#fff1f2}
    .date-num{font-weight:950;font-size:16px;margin-bottom:4px}.period{font-size:11px;color:#6b7280;margin-bottom:4px}
    .busy-label{display:inline-block;background:#dc2626;color:white;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;margin-bottom:5px}
    .shift{border-radius:10px;padding:6px;margin-top:6px;font-size:12px;line-height:1.35}.morning{background:#fef3c7;color:#78350f}.night{background:#e0e7ff;color:#312e81}
    .off{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:999px;padding:2px 6px;margin:2px 2px 0 0;font-weight:800}
    .work{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:2px 6px;margin:2px 2px 0 0}
    .small{font-size:13px;color:#6b7280}
    .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
    .stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}
    @media print{.no-print{display:none!important}.card{box-shadow:none}.container{max-width:none;padding:0}}
    @media(max-width:900px){.calendar{grid-template-columns:1fr}.dow,.empty{display:none}.day{min-height:auto;border-right:none}}
  </style>
</head>
<body>
<div class="container">
  <h1>สรุปล่าสุดตารางวันหยุด</h1>
  <p class="subtitle">หน้านี้สำหรับพนักงานดูตารางล่าสุด อัปเดตแบบ realtime เมื่อมีคนแก้หรือสลับวันหยุด</p>

  <div id="status" class="warn">กำลังโหลดข้อมูลล่าสุด...</div>

  <div class="toolbar no-print">
    <a class="btn gray" href="./index.html">ไปหน้าแก้ไขตาราง</a>
    <button onclick="window.print()">พิมพ์ / บันทึก PDF</button>
    <button class="gray" onclick="downloadCSV()">ดาวน์โหลด CSV</button>
  </div>

  <div class="card">
    <h2>ข้อมูลตารางล่าสุด</h2>
    <div id="latestInfo" class="small">ยังไม่มีข้อมูล</div>
  </div>

  <div class="card">
    <h2>ใครหยุดวันไหนบ้าง</h2>
    <div id="personSummary" class="small">ยังไม่มีข้อมูล</div>
  </div>

  <div class="card">
    <h2>ปฏิทินล่าสุด</h2>
    <div id="calendar"></div>
  </div>

  <div class="card">
    <h2>ประวัติการแก้ไขล่าสุด</h2>
    <div id="history">ยังไม่มีประวัติ</div>
  </div>
</div>

<script type="module" src="./firebase-config.js"></script>
<script type="module" src="./summary.js"></script>
</body>
</html>
